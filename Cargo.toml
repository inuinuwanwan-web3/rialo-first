[package]
name = "rialo-first"
version = "0.1.0"
edition = "2024"
default-run = "rialo-first"

[dependencies]
rialo-cdk = "=0.18.1"
rialo-s-message = { version = "=0.18.1", features = ["bincode"] }
base64 = "=0.22.1"
bincode = "=1.3.3"
ed25519-dalek = "=2.2.0"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }
